# บริการพื้นฐานสำหรับ dev — `docker compose up -d`
# พอร์ต host ขยับจากค่ามาตรฐานเพื่อไม่ชนกับโปรเจกต์อื่นบนเครื่องเดียวกัน
name: blulens

services:
  postgres:
    image: postgres:16-alpine
    container_name: blulens-postgres
    environment:
      POSTGRES_USER: blulens
      POSTGRES_PASSWORD: blulens
      POSTGRES_DB: blulens
    ports:
      - "5442:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blulens -d blulens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blulens-redis
    ports:
      - "6389:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: blulens-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - ./docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
