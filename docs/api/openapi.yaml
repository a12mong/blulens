openapi: 3.1.0
info:
  title: blulens API
  version: 0.1.0-draft
  description: |
    Single source of truth for the Web <-> API contract. bl-02 v1 APPROVED by the owner 2026-10-07 (incl. A8/A11/A13/A14 changes).
    Includes bl-17 tag 'format' (v1 approved, Umpire role) and grading v2 (provisional, minReviewers, calibration) — all owner-approved.
    Specs: docs/specs/architecture.md, docs/specs/grading.md, docs/specs/draw.md.
    Conventions:
      - Auth via httpOnly cookies: bl_access (JWT 15 min, path /), bl_refresh (7 days, path /api/v1/auth),
        bl_session (non-secret marker for Next middleware). SameSite=Lax, Secure in prod. No Authorization header.
        No CSRF token: same-origin via Next rewrite + SameSite=Lax + API rejects mutating requests whose
        Origin header is not the site origin (architecture.md §6.2).
      - Sorting: ?sort=<field>:<asc|desc>, fields whitelisted per endpoint (x-sort). No realtime in v1 (poll).
      - Every response is wrapped in an envelope: { success: true, data } or { success: false, error }.
        Schemas below describe `data` only; see components.schemas.Envelope* for the wrapper.
      - Times are ISO-8601 UTC. Lists use cursor pagination (?cursor=&limit=) -> { items, nextCursor }.
      - Envelope schemas and request/response zod live in packages/shared/src/schemas (must match this file).
      - x-roles lists the roles allowed to call an operation (Admin, Committee, Reviewer, Member, Guest).
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: teams
  - name: assessments
  - name: reviews
  - name: rater-stats
  - name: tournaments
  - name: draws
  - name: audit
  - name: format
    description: bl-17 (docs/specs/tournament-format.md) v1 approved

paths:
  /health:
    get:
      tags: [auth]
      summary: Liveness probe (no DB access)
      x-roles: [Guest]
      responses:
        '200': { description: ok }

  # ---------------- auth ----------------
  /auth/register:
    post:
      tags: [auth]
      summary: Create a Member account
      x-roles: [Guest]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in; sets auth cookies
      x-roles: [Guest]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token (reuse detection revokes the family)
      x-roles: [Member, Reviewer, Committee, Admin]
      responses:
        '204': { description: rotated }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke session and clear cookies
      x-roles: [Member, Reviewer, Committee, Admin]
      responses:
        '204': { description: logged out }
  /auth/me:
    get:
      tags: [auth]
      summary: Current user, roles, permissions, current approved grade
      x-roles: [Member, Reviewer, Committee, Admin]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }

  # ---------------- users / teams ----------------
  /users:
    get:
      tags: [teams]
      summary: 'User search for pickers (bl-21 slice: Committee registers a player on behalf)'
      x-roles: [Committee, Admin]
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: q, in: query, schema: { type: string, description: display name or email prefix } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserPickerItem' } }
                  nextCursor: { type: [string, 'null'] }
  /users/{userId}/roles:
    put:
      tags: [teams]
      summary: Replace a user's roles
      x-roles: [Admin]
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, items: { $ref: '#/components/schemas/Role' }, minItems: 1 }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UserSummary' } } } }
  /teams:
    get:
      tags: [teams]
      summary: List teams/clubs
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TeamPage' } } } }
    post:
      tags: [teams]
      summary: Create a team
      x-roles: [Committee, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                shortName: { type: string, maxLength: 16 }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Team' } } } }
  /teams/suggest:
    get:
      tags: [teams]
      summary: Type-ahead team suggestions (names, aliases; tolerant to small typos). User must pick one (A8).
      x-roles: [Member, Reviewer, Committee, Admin]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [teamId, name]
                  properties:
                    teamId: { type: string, format: uuid }
                    name: { type: string }
                    matchedAlias: { type: [string, 'null'] }
                    distance: { type: integer, description: edit distance of the match (0 = exact/prefix) }
  /team-requests:
    post:
      tags: [teams]
      summary: Request a new team when no suggestion matches (A8)
      x-roles: [Member, Reviewer, Committee, Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRequest' } } } }
    get:
      tags: [teams]
      summary: Pending team requests
      x-roles: [Committee, Admin]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TeamRequest' } }
  /team-requests/{requestId}/resolve:
    post:
      tags: [teams]
      summary: Approve as a new team, alias to an existing team, or reject
      x-roles: [Committee, Admin]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [create_team, alias_to_team, reject] }
                teamId: { type: string, format: uuid, description: required for alias_to_team }
                reason: { type: string }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TeamRequest' } } } }
  /me/teams:
    post:
      tags: [teams]
      summary: Member joins a team (several teams allowed, A11). Response carries the resulting team count.
      x-roles: [Member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamId]
              properties:
                teamId: { type: string, format: uuid }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams: { type: array, items: { $ref: '#/components/schemas/Team' } }
                  teamCount: { type: integer }
                  warnings: { type: array, items: { type: string, enum: [MULTI_TEAM] } }
  /teams/{teamId}/members:
    post:
      tags: [teams]
      summary: Add a user to a team from a date (several concurrent teams allowed; dated; draw uses memberships on draw date)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, validFrom]
              properties:
                userId: { type: string, format: uuid }
                validFrom: { type: string, format: date }
      responses:
        '201': { description: created }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------- assessments (grading.md) ----------------
  /assessments:
    post:
      tags: [assessments]
      summary: Member opens an assessment request (status draft)
      x-roles: [Member]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000, description: 'Member context for the reviewers (stored in assessments.note; shown to assigned reviewers and the Committee)' }
                eventId: { type: string, format: uuid, description: 'A13: event-bound assessment for an event with requiresFreshAssessment' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
    get:
      tags: [assessments]
      summary: List assessments (Member sees own; Committee sees all, filter by status)
      x-roles: [Member, Committee, Admin]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AssessmentStatus' } }
        - { name: subjectUserId, in: query, schema: { type: string, format: uuid } }
        - { name: sort, in: query, schema: { type: string, default: 'createdAt:desc' } }
      x-sort: [createdAt, updatedAt, status]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentPage' } } } }
  /assessments/{assessmentId}:
    get:
      tags: [assessments]
      summary: Assessment detail incl. latest result (per-reviewer scores only for Committee)
      x-roles: [Member, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /assessments/{assessmentId}/clips/upload-url:
    post:
      tags: [assessments]
      summary: Get a presigned PUT URL for one clip (draft only; max 3 clips, 500 MB, mp4/mov)
      x-roles: [Member]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, sizeBytes]
              properties:
                fileName: { type: string }
                contentType: { type: string, enum: [video/mp4, video/quicktime] }
                sizeBytes: { type: integer, maximum: 524288000 }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [clipId, uploadUrl, expiresAt]
                properties:
                  clipId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '422': { $ref: '#/components/responses/Validation' }
  /clips/{clipId}/playback-url:
    get:
      tags: [assessments]
      summary: Fresh presigned GET URL for a clip (owner Member, assigned Reviewer, Committee)
      description: |
        URL host = S3_PUBLIC_ENDPOINT (prod https://files.<domain>, dev http://localhost:9100). TTL 15 min.
        Byte-range requests supported (Caddy files block has no gzip). Web re-calls this when a URL expires.
      x-roles: [Member, Reviewer, Committee]
      parameters: [{ name: clipId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [url, expiresAt]
                properties:
                  url: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        '403': { description: CLIP_FORBIDDEN, content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /assessments/{assessmentId}/submit:
    post:
      tags: [assessments]
      summary: Member submits the request (draft -> submitted); requires >= 1 uploaded clip
      x-roles: [Member]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Assessment' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /assessments/{assessmentId}/assign:
    post:
      tags: [assessments]
      summary: Committee assigns reviewers (conflict-of-interest checked server-side)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerIds]
              properties:
                reviewerIds: { type: array, items: { type: string, format: uuid }, minItems: 1 }
                dueAt: { type: string, format: date-time, description: default now + 72h }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '409': { description: 'REVIEWER_CONFLICT_OF_INTEREST | ASSESSMENT_NOT_ASSIGNABLE', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /assessments/{assessmentId}/approve:
    post:
      tags: [assessments]
      summary: Committee approves the latest computed result (pending_approval|disputed -> approved)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resultVersion: { type: integer, description: optimistic check — must equal the latest version }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /assessments/{assessmentId}/return:
    post:
      tags: [assessments]
      summary: Committee sends back for more reviews (-> in_review) with a reason
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
  /assessments/{assessmentId}/confirm:
    post:
      tags: [assessments]
      summary: 'Committee confirms a provisional single-reviewer result (provisional -> approved; flag SINGLE_REVIEWER kept) (grading.md §12, G17)'
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resultVersion: { type: integer }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '409': { description: 'ASSESSMENT_NOT_PROVISIONAL', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /assessments/{assessmentId}/second-opinion:
    post:
      tags: [assessments]
      summary: 'Request one more reviewer (G20): the subject Member once per request within 14 days of the result; Committee any time'
      x-roles: [Member, Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '409': { description: 'SECOND_OPINION_ALREADY_USED | SECOND_OPINION_WINDOW_CLOSED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /assessments/{assessmentId}/override:
    post:
      tags: [assessments]
      summary: Super-Committee override — writes a new result version with source=override (see grading.md §8)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OverrideInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentDetail' } } } }
        '403': { description: 'OVERRIDE_CONFLICT_OF_INTEREST', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /assessments/{assessmentId}/results:
    get:
      tags: [assessments]
      summary: Full result history (append-only versions)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/AssessmentId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AssessmentResult' } }

  # ---------------- reviews ----------------
  /reviews/assignments/me:
    get:
      tags: [reviews]
      summary: My open/finished review assignments
      x-roles: [Reviewer]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, submitted, expired] } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReviewAssignment' } }
  /reviews/assignments/{assignmentId}:
    get:
      tags: [reviews]
      summary: Assignment detail with clip view URLs and the rubric (never other reviewers' scores)
      description: 'Only the assigned reviewer (404 for anyone else, to not leak task ids). Used by /review/tasks/[id]. Clip viewUrl is a fresh 15-min presigned GET; when it expires the web calls /clips/{clipId}/playback-url.'
      x-roles: [Reviewer]
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewAssignmentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [reviews]
      summary: Submit the review (once; immutable after submit)
      x-roles: [Reviewer]
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewAssignment' } } } }
        '409': { description: 'REVIEW_ALREADY_SUBMITTED | ASSIGNMENT_EXPIRED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /reviews/assignments/{assignmentId}/decline:
    post:
      tags: [reviews]
      summary: Reviewer declines (conflict, cannot judge clip) — Committee reassigns
      x-roles: [Reviewer]
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '204': { description: declined }
  /rubric:
    get:
      tags: [reviews]
      summary: Active rubric (criteria, weights, anchors) and method version
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Rubric' } } } }

  # ---------------- rater stats ----------------
  /rater-stats:
    get:
      tags: [rater-stats]
      summary: Rater agreement (Cohen weighted kappa per pair, Fleiss kappa for the panel, bias per rater)
      x-roles: [Committee, Reviewer]
      description: Reviewer receives only their own row and the panel figure.
      parameters:
        - { name: window, in: query, schema: { type: string, enum: [30d, 90d, 365d, all], default: 90d } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RaterStats' } } } }

  /rater-stats/pairs/{reviewerA}/{reviewerB}:
    get:
      tags: [rater-stats]
      summary: 'Drill-down of a PairMatrix cell: the cases both reviewers scored (Committee only)'
      x-roles: [Committee]
      parameters:
        - { name: reviewerA, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: reviewerB, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: window, in: query, schema: { type: string, enum: [30d, 90d, 365d, all], default: 90d } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  cohenKappaQuadratic: { $ref: '#/components/schemas/AgreementValue' }
                  cases:
                    type: array
                    items:
                      type: object
                      properties:
                        assessmentId: { type: string, format: uuid }
                        subjectDisplayName: { type: string }
                        overallA: { type: number, description: reviewer A overall (ladder units) }
                        overallB: { type: number }
                        gap: { type: number }
                        submittedAt: { type: string, format: date-time }
  # ---------------- calibration (grading.md §12.4, G19 option b) ----------------
  /calibration-sets:
    get:
      tags: [rater-stats]
      summary: Calibration clip sets (reference grades visible to the Committee only)
      x-roles: [Committee]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CalibrationSet' } }
    post:
      tags: [rater-stats]
      summary: Create a calibration set (e.g. 5 clips per quarter); clips are uploaded via /calibration-sets/{setId}/clips/upload-url
      x-roles: [Committee]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                period: { type: string, example: 2026-Q4 }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/CalibrationSet' } } } }
  /calibration-sets/{setId}/clips/upload-url:
    post:
      tags: [rater-stats]
      summary: Presigned PUT for one calibration clip + its Committee reference grade
      x-roles: [Committee]
      parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, contentType, sizeBytes, referenceKey]
              properties:
                fileName: { type: string }
                contentType: { type: string, enum: [video/mp4, video/quicktime] }
                sizeBytes: { type: integer, maximum: 524288000 }
                referenceKey: { $ref: '#/components/schemas/GradeKey' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  clipId: { type: string, format: uuid }
                  uploadUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
  /calibration-sets/{setId}/assign:
    post:
      tags: [rater-stats]
      summary: Assign the set to reviewers (blind; each clip appears as a normal review task flagged calibration)
      x-roles: [Committee]
      parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewerIds]
              properties:
                reviewerIds: { type: array, items: { type: string, format: uuid } }
                dueAt: { type: string, format: date-time }
      responses:
        '204': { description: assigned }
  /calibration-sets/{setId}/results:
    get:
      tags: [rater-stats]
      summary: Per-reviewer bias vs the reference grades for this set
      x-roles: [Committee]
      parameters: [{ name: setId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    reviewerId: { type: string, format: uuid }
                    clipsScored: { type: integer }
                    biasVsReference: { type: number, description: 'mean(reviewer overall - (idx(referenceKey) + 0.5)), ladder units' }
                    meanAbsError: { type: number }

  # ---------------- tournaments ----------------
  /tournaments:
    get:
      tags: [tournaments]
      summary: List tournaments
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentPage' } } } }
    post:
      tags: [tournaments]
      summary: Create a tournament
      x-roles: [Committee]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TournamentInput' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Tournament' } } } }
  /tournaments/{tournamentId}:
    get:
      tags: [tournaments]
      summary: Tournament detail with its events (bl-21 slice)
      x-roles: [Guest, Member, Reviewer, Umpire, Committee, Admin]
      description: Guest/Member see only tournaments that are not draft.
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /tournaments/{tournamentId}/status:
    post:
      tags: [tournaments]
      summary: 'Move the tournament through its lifecycle: draft -> open (entries accepted) -> closed (entries locked; also automatic at entriesCloseAt) -> running -> finished'
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, enum: [open, closed, running, finished] }
                reason: { type: string, description: required when re-opening is ever allowed (not in v1) }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/TournamentDetail' } } } }
        '409': { description: 'TOURNAMENT_INVALID_TRANSITION (allowed: draft->open, open->closed, closed->running, running->finished)', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /tournaments/{tournamentId}/events:
    get:
      tags: [tournaments]
      summary: Events of a tournament (bl-21 slice)
      x-roles: [Guest, Member, Reviewer, Umpire, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Event' } }
    post:
      tags: [tournaments]
      summary: Add an event (e.g. men's singles, grade band S-..S+)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/TournamentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /events/{eventId}:
    get:
      tags: [tournaments]
      summary: Event detail incl. tournament status and entry count (bl-21 slice)
      x-roles: [Guest, Member, Reviewer, Umpire, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /events/{eventId}/entries:
    get:
      tags: [tournaments]
      summary: 'Entries of an event. Guest/Member/Reviewer/Umpire see approved entries only; Admin/Committee see every status (filter with ?status=)'
      x-roles: [Guest, Member, Reviewer, Umpire, Committee, Admin]
      parameters:
        - { $ref: '#/components/parameters/EventId' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EntryStatus' } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Entry' } }
    post:
      tags: [tournaments]
      summary: 'Create an entry on behalf of players (architecture §6.10): status draft. Doubles = exactly 2 players, singles = 1. Grade/team problems do NOT block creation; they come back as warnings for the Committee. Member self-registration (x-roles Member) is reserved for later and OUT of Demo Slice 1. No clip on entries.'
      x-roles: [Admin, Committee, Member]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'ENTRIES_CLOSED | ENTRY_PLAYER_COUNT (2 for doubles, 1 for singles) | ENTRY_DUPLICATE_PLAYER (a player already has a non-withdrawn entry in this event)', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /entries:
    get:
      tags: [tournaments]
      summary: 'Committee queue across events, e.g. ?status=pending_committee (bl-21)'
      x-roles: [Committee, Admin]
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/EntryStatus' } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Entry' } }
                  nextCursor: { type: [string, 'null'] }
  /entries/{entryId}:
    patch:
      tags: [tournaments]
      summary: Edit a draft or rejected entry (a rejected entry returns to draft)
      x-roles: [Admin, Committee]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'ENTRY_NOT_EDITABLE', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /entries/{entryId}/forward:
    post:
      tags: [tournaments]
      summary: Forward a draft entry to the Committee (draft -> pending_committee)
      x-roles: [Admin, Committee]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'ENTRY_NOT_DRAFT', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /entries/{entryId}/approve:
    post:
      tags: [tournaments]
      summary: 'Committee approves eligibility (pending_committee -> approved). Blocked while any player lacks an approved grade; a grade outside the event band needs a reason (audited)'
      x-roles: [Committee]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 20, maxLength: 2000, description: required when warnings include GRADE_OUT_OF_BAND }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'ENTRY_NOT_PENDING | ENTRY_PLAYER_UNGRADED | ENTRY_FRESH_ASSESSMENT_MISSING (event requiresFreshAssessment and a player has no approved assessment bound to it, A13) | ENTRY_OUT_OF_BAND_REASON_REQUIRED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /entries/{entryId}/reject:
    post:
      tags: [tournaments]
      summary: Committee rejects (pending_committee -> rejected) with a reason; Admin may edit and forward again
      x-roles: [Committee]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntryRejectInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
        '409': { description: 'ENTRY_NOT_PENDING', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /entries/{entryId}/grade-consent:
    put:
      tags: [tournaments]
      summary: A player of the entry gives/withdraws consent to show the entry grade (A14). Doubles = both must consent.
      x-roles: [Member]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent]
              properties:
                consent: { type: boolean }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Entry' } } } }
  /events/{eventId}/grades/disclose:
    post:
      tags: [tournaments]
      summary: Transparency function, disclose all entry grades of the event regardless of consent (A14; audited, players notified)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditedReasonInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
    delete:
      tags: [tournaments]
      summary: Revoke the disclosure (reason required; audited)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditedReasonInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Event' } } } }
  /entries/{entryId}/withdraw:
    post:
      tags: [tournaments]
      summary: Withdraw an entry (after publish -> walkover/replacement per draw.md §7, never a silent redraw)
      x-roles: [Member, Committee]
      parameters: [{ name: entryId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '204': { description: withdrawn }

  # ---------------- draws (draw.md) ----------------
  /events/{eventId}/draws/preview:
    post:
      tags: [draws]
      summary: Generate a draw preview (status preview; logged with its seed)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed: { type: string, pattern: '^[0-9a-f]{32}$', description: omit to let the server generate one (CSPRNG) }
                seedCount: { type: integer, minimum: 0, description: omit to use the ruleset default }
      responses:
        '201': { description: created, content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } } }
        '409': { description: 'ENTRIES_NOT_CLOSED | DRAW_ALREADY_LOCKED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /events/{eventId}/draws:
    get:
      tags: [draws]
      summary: All draw versions of an event (previews + published + superseded)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DrawSummary' } }
  /draws/{drawId}:
    get:
      tags: [draws]
      summary: Draw detail (slots, round-1 matches, conflicts, seed, input hash)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/DrawId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } } }
  /draws/{drawId}/publish:
    post:
      tags: [draws]
      summary: Publish a preview. Requires acknowledgeConflicts=true when the draw has unavoidable same-team R1 matches.
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/DrawId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgeConflicts: { type: boolean, default: false }
                reason: { type: string, description: required when this supersedes an already-published draw }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } } }
        '409': { description: 'DRAW_INPUT_CHANGED | DRAW_CONFLICTS_NOT_ACKNOWLEDGED | DRAW_ALREADY_LOCKED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /draws/{drawId}/verify:
    get:
      tags: [draws]
      summary: Re-run the solver from the stored seed + input snapshot and compare (reproducibility check)
      x-roles: [Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/DrawId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [identical]
                properties:
                  identical: { type: boolean }
  /events/{eventId}/bracket:
    get:
      tags: [draws]
      summary: Public bracket of the published draw
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Bracket' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- format: groups + knockout (bl-17 DRAFT, tournament-format.md) ----------------
  /events/{eventId}/format:
    put:
      tags: [format]
      summary: Set the event format (before it is locked by the first group/knockout draw)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventFormat' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/EventFormat' } } } }
        '409': { description: 'FORMAT_LOCKED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /events/{eventId}/groups/preview:
    post:
      tags: [format]
      summary: Group draw preview (Draw kind=group); publish/verify via the existing /draws endpoints
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed: { type: string, pattern: '^[0-9a-f]{32}$' }
                groupCount: { type: integer, minimum: 1, description: override when the default sizing rule fails }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } } }
  /events/{eventId}/groups:
    get:
      tags: [format]
      summary: Groups with members and the round-robin schedule
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Group' } }
  /events/{eventId}/groups/confirm:
    post:
      tags: [format]
      summary: Confirm group-stage results -> snapshot group_standings, unlock knockout generation
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GroupStanding' } }
        '409': { description: 'GROUP_MATCHES_INCOMPLETE', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /events/{eventId}/standings:
    get:
      tags: [format]
      summary: Live group standings (or the confirmed snapshot)
      x-roles: [Guest, Member, Reviewer, Committee, Admin]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GroupStanding' } }
  /events/{eventId}/knockout/preview:
    post:
      tags: [format]
      summary: Knockout draw preview seeded from the confirmed standings (Draw kind=knockout)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                seed: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '201': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Draw' } } } }
        '409': { description: 'GROUP_STAGE_NOT_CONFIRMED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /events/{eventId}/matches:
    get:
      tags: [format]
      summary: 'Matches of an event (schedule, results). Public roles see scheduled/reported/confirmed (reported shown as awaiting confirmation)'
      x-roles: [Guest, Member, Reviewer, Umpire, Committee, Admin]
      parameters:
        - { $ref: '#/components/parameters/EventId' }
        - { name: status, in: query, schema: { type: string, enum: [scheduled, bye, reported, confirmed, walkover, void] } }
        - { name: stage, in: query, schema: { type: string, enum: [group, knockout, third_place] } }
        - { name: round, in: query, schema: { type: integer } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Match' } }
  /matches:
    get:
      tags: [format]
      summary: 'Committee results queue across events, e.g. ?status=reported'
      x-roles: [Committee]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [scheduled, reported, confirmed] } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Match' } }
                  nextCursor: { type: [string, 'null'] }
  /matches/{matchId}/result:
    put:
      tags: [format]
      summary: 'Enter/edit a match result (validated against the stage MatchFormat; audited). Umpire -> status reported; Committee -> confirmed directly (or correction of a confirmed result, reason required)'
      x-roles: [Umpire, Committee]
      parameters: [{ name: matchId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome: { type: string, enum: [played, walkover_a, walkover_b] }
                reason: { type: string, description: required when the Committee corrects a confirmed result }
                games:
                  type: array
                  items: { type: object, required: [a, b], properties: { a: { type: integer, minimum: 0 }, b: { type: integer, minimum: 0 } } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
        '422': { description: 'MATCH_SCORE_INVALID', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '409': { description: 'STAGE_CONFIRMED | MATCH_ALREADY_CONFIRMED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
        '403': { description: 'UMPIRE_NOT_ASSIGNED | UMPIRE_OWN_MATCH', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /matches/{matchId}/result/approve:
    post:
      tags: [format]
      summary: Committee confirms a reported result (reported -> confirmed; audited)
      x-roles: [Committee]
      parameters: [{ name: matchId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
        '409': { description: 'MATCH_NOT_REPORTED', content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
  /matches/{matchId}/result/reject:
    post:
      tags: [format]
      summary: Committee sends a reported result back to the umpire (reported -> scheduled; reason required)
      x-roles: [Committee]
      parameters: [{ name: matchId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
  /matches/{matchId}/assignment:
    patch:
      tags: [format]
      summary: Set court label and/or umpire for one match
      x-roles: [Committee]
      parameters: [{ name: matchId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                court: { type: [string, 'null'], maxLength: 32 }
                umpireId: { type: [string, 'null'], format: uuid }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } }
  /events/{eventId}/umpires:
    get:
      tags: [format]
      summary: Umpires assigned to the event (with courts)
      x-roles: [Committee, Umpire]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventUmpire' } }
    put:
      tags: [format]
      summary: Replace the umpire assignment of the event (courts empty = all courts)
      x-roles: [Committee]
      parameters: [{ $ref: '#/components/parameters/EventId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/EventUmpire' } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EventUmpire' } }
  /umpire/matches:
    get:
      tags: [format]
      summary: Matches the calling umpire may report (assigned directly or on an assigned court)
      x-roles: [Umpire]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [scheduled, reported, confirmed] } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Match' } }

  # ---------------- audit ----------------
  /audit-logs:
    get:
      tags: [audit]
      summary: Append-only audit trail
      x-roles: [Admin]
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }

components:
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    UserId: { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    TeamId: { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    AssessmentId: { name: assessmentId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    TournamentId: { name: tournamentId, in: path, required: true, schema: { type: string, format: uuid } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    DrawId: { name: drawId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized: { description: UNAUTHENTICATED, content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    NotFound: { description: NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    Conflict: { description: state conflict (code says which), content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }
    Validation: { description: VALIDATION_FAILED, content: { application/json: { schema: { $ref: '#/components/schemas/EnvelopeError' } } } }

  schemas:
    # ---- envelope ----
    EnvelopeError:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: REVIEW_ALREADY_SUBMITTED }
            message: { type: string, description: Thai, safe to show to the user }
            details: { type: object, additionalProperties: true }

    # ---- identity ----
    Role: { type: string, enum: [Admin, Committee, Umpire, Reviewer, Member], description: 'Guest = not logged in (not a stored role)' }
    RegisterInput:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 10 }
        displayName: { type: string, minLength: 1, maxLength: 80 }
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string }
        password: { type: string }
    UserSummary:
      type: object
      required: [id, displayName, roles]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        teamIds: { type: array, items: { type: string, format: uuid }, description: 'current teams (several allowed, A11)' }
    UserPickerItem:
      type: object
      description: 'GET /users result (Admin/Committee pickers only): adds club names and the current grade label, which these roles may see'
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        teamIds: { type: array, items: { type: string, format: uuid } }
        teamNames: { type: array, items: { type: string } }
        gradeLabel: { type: [string, 'null'], description: 'label of the current official grade (approved/overridden), null if none' }
        gradeProvisional: { type: boolean, description: 'true when only a provisional (unconfirmed) result exists' }
    Me:
      allOf:
        - { $ref: '#/components/schemas/UserSummary' }
        - type: object
          properties:
            email: { type: string, format: email }
            permissions: { type: array, items: { type: string } }
            currentGrade: { oneOf: [{ $ref: '#/components/schemas/GradeView' }, { type: 'null' }] }
    Team:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shortName: { type: string }
    TeamRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        requestedBy: { type: string, format: uuid }
        status: { type: string, enum: [pending, created, aliased, rejected] }
        teamId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
    AuditedReasonInput:
      type: object
      description: reason-bearing input (>= 20 chars) for audited privileged actions
      required: [reason]
      properties:
        reason: { type: string, minLength: 20, maxLength: 2000 }
    TeamPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Team' } }
        nextCursor: { type: [string, 'null'] }

    # ---- grading output shape (bad8bit-style; grading.md §6) ----
    GradeKey:
      type: string
      description: 15-rung ladder, index 0..14, ASCII hyphen
      enum: [RK1, RK2, RK3, BG1, BG2, BG3, S-, S, S+, N-, N, N+, P-, P, P+]
    Tier: { type: string, enum: [Rookie, Beginner, Standard, Neutral, Professional] }
    GradeView:
      type: object
      description: |
        The assessment result shape every client renders. score is continuous in ladder units [0, 15);
        interval is half-open [score - margin, score + margin): lower = grade key of floor(score - margin),
        upper = grade key of ceil(score + margin) - 1, both clamped to 0..14 (grading.md appendix B.4);
        center = grade key of floor(score). label derives from lower/upper/kind.
      required: [score, lower, upper, center, kind, label]
      properties:
        score: { type: number, minimum: 0, maximum: 15, example: 7.4 }
        margin: { type: number, minimum: 0, example: 0.6 }
        lower: { $ref: '#/components/schemas/GradeKey' }
        upper: { $ref: '#/components/schemas/GradeKey' }
        center: { $ref: '#/components/schemas/GradeKey' }
        tier: { $ref: '#/components/schemas/Tier' }
        kind: { type: string, enum: [exact, straddle, wide] }
        label: { type: string, example: S/S+, description: 'exact "S" | straddle "S/S+" | wide "S-–N" (en dash)' }

    # ---- assessments ----
    AssessmentStatus:
      type: string
      enum: [draft, submitted, in_review, needs_reviewers, provisional, disputed, pending_approval, approved, overridden, rejected, withdrawn]
      description: 'provisional = single-reviewer result awaiting Committee confirm (grading.md §12, G17)'
    Assessment:
      type: object
      required: [id, subjectUserId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectUserId: { type: string, format: uuid }
        eventId: { type: [string, 'null'], format: uuid, description: 'A13 event-bound assessment' }
        status: { $ref: '#/components/schemas/AssessmentStatus' }
        subject:
          type: object
          required: [userId, displayName, clubNames]
          description: 'who is assessed: ALWAYS filled in list + detail (never sent to reviewers, who only get blind ReviewAssignment)'
          properties:
            userId: { type: string, format: uuid }
            displayName: { type: string }
            clubNames: { type: array, items: { type: string }, description: 'names of the active team memberships, de-duplicated and sorted' }
        event:
          oneOf:
            - type: object
              required: [id, discipline, tournamentName]
              properties:
                id: { type: string, format: uuid }
                discipline: { type: string, enum: [MS, WS, MD, WD, XD], description: 'an event has no name of its own; the web labels it "<tournamentName> · <discipline in Thai>"' }
                tournamentName: { type: string }
            - { type: 'null' }
          description: 'the event an A13 fresh assessment is bound to; null for a standalone request (web shows "ประเมินทั่วไป")'
        latestGrade: { oneOf: [{ $ref: '#/components/schemas/GradeView' }, { type: 'null' }], description: 'grade of the latest result version (list rows show its label without loading the detail)' }
        latestResultVersion: { type: [integer, 'null'] }
        reviewsSubmitted: { type: integer }
        reviewsRequired: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssessmentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Assessment' } }
        nextCursor: { type: [string, 'null'] }
    AssessmentResult:
      type: object
      required: [version, source, grade, nRaters, nExcluded, methodVersion, computedAt]
      properties:
        version: { type: integer }
        source: { type: string, enum: [computed, override] }
        status: { type: string, enum: [pending, approved, superseded], description: approval state of this result row }
        grade: { $ref: '#/components/schemas/GradeView' }
        nRaters: { type: integer, description: valid reviews used after exclusion }
        nExcluded: { type: integer, description: reviews excluded as outliers }
        spread: { type: number, description: max - min of used rater scores (ladder units) }
        flags: { type: array, items: { type: string, enum: [OUTLIER_EXCLUDED, HIGH_DISAGREEMENT, LOW_RATER_COUNT, OVERRIDE, SINGLE_REVIEWER, PAIR_DISAGREEMENT] } }
        methodVersion: { type: string, example: grading-v1 }
        reason: { type: string, description: override only }
        computedAt: { type: string, format: date-time }
        computedBy: { type: [string, 'null'], format: uuid, description: null for computed }
    AssignmentProgressRow:
      type: object
      required: [id, reviewerId, reviewerName, state, dueAt]
      properties:
        id: { type: string, format: uuid, description: assignment id }
        reviewerId: { type: string, format: uuid }
        reviewerName: { type: string }
        state: { type: string, enum: [open, submitted, expired, declined] }
        dueAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    ReviewerScoreRow:
      type: object
      description: Committee-only view of one reviewer's contribution
      properties:
        reviewerId: { type: string, format: uuid }
        reviewerName: { type: string }
        overall: { type: number }
        excluded: { type: boolean }
        robustZ: { type: [number, 'null'], description: 'null when n < 3 (no outlier rule)' }
        reviewerBias: { type: [number, 'null'], description: 'cross-event bias vs consensus/calibration, ladder units; null below minimum sample (§12.4)' }
        pairKappa: { type: [number, 'null'], description: 'n = 2 only: Cohen quadratic weighted kappa history of this reviewer pair (>= 10 shared cases)' }
        criteria: { type: array, items: { $ref: '#/components/schemas/CriterionScore' } }
    AssessmentDetail:
      allOf:
        - { $ref: '#/components/schemas/Assessment' }
        - type: object
          properties:
            clips: { type: array, items: { $ref: '#/components/schemas/Clip' } }
            latestResult: { oneOf: [{ $ref: '#/components/schemas/AssessmentResult' }, { type: 'null' }] }
            reviewerRows: { type: array, items: { $ref: '#/components/schemas/ReviewerScoreRow' }, description: Committee only }
            assignments:
              type: array
              description: 'Committee/Admin only ([] for the subject Member): who is assigned and whether they have submitted, so an in_review request shows progress. NO scores here (scores appear in reviewerRows only after aggregation), so the panel stays independent. Ordered by the assignment createdAt.'
              items: { $ref: '#/components/schemas/AssignmentProgressRow' }
    Clip:
      type: object
      required: [id, status, viewUrl]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending_upload, uploaded, rejected], description: 'uploaded = playable (there is no separate ready state in v1; no transcoding)' }
        viewUrl: { type: [string, 'null'], format: uri, description: 'presigned GET (15 min); null unless status = uploaded' }
        durationSec: { type: [integer, 'null'] }

    # ---- reviews ----
    Rubric:
      type: object
      required: [methodVersion, criteria]
      properties:
        methodVersion: { type: string }
        criteria:
          type: array
          items:
            type: object
            required: [key, nameTh, weight]
            properties:
              key: { type: string, example: footwork }
              nameTh: { type: string }
              weight: { type: number }
              anchorsTh: { type: object, additionalProperties: { type: string }, description: tier -> description }
    CriterionScore:
      type: object
      required: [criterion]
      properties:
        criterion: { type: string }
        gradeKey: { oneOf: [{ $ref: '#/components/schemas/GradeKey' }, { type: 'null' }], description: null = cannot assess from clip }
    CalibrationSet:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        period: { type: string }
        clips:
          type: array
          items:
            type: object
            properties:
              clipId: { type: string, format: uuid }
              referenceKey: { $ref: '#/components/schemas/GradeKey' }
        createdAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [scores]
      properties:
        scores: { type: array, items: { $ref: '#/components/schemas/CriterionScore' }, minItems: 1 }
        comment: { type: string, maxLength: 2000 }
    ReviewAssignment:
      type: object
      description: 'Reviewer-facing task. BLIND: never exposes the assessment id, the subject, or whether the task is a calibration clip; the assignment id is the neutral task id used in every reviewer endpoint. Committee views (AssessmentDetail.reviewerRows, /calibration-sets/*) carry the kind and the link to the assessment or calibration clip.'
      required: [id, state, dueAt]
      properties:
        id: { type: string, format: uuid, description: neutral task id (assignment id) }
        state: { type: string, enum: [open, submitted, expired, declined] }
        dueAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    ReviewAssignmentDetail:
      allOf:
        - { $ref: '#/components/schemas/ReviewAssignment' }
        - type: object
          required: [clips, rubric, myScores]
          properties:
            clips: { type: array, items: { $ref: '#/components/schemas/Clip' } }
            rubric: { $ref: '#/components/schemas/Rubric' }
            myScores: { type: array, items: { $ref: '#/components/schemas/CriterionScore' }, description: 'empty while state = open; the submitted scores after submit' }

    # ---- rater stats ----
    AgreementValue:
      type: object
      properties:
        kappa: { type: [number, 'null'], description: null when below minimum shared subjects }
        n: { type: integer, description: subjects used }
        band: { type: string, enum: [poor, fair, moderate, substantial, almost_perfect, insufficient] }
    RaterStats:
      type: object
      properties:
        window: { type: string }
        methodVersion: { type: string }
        panel:
          type: object
          properties:
            fleissKappaTier: { $ref: '#/components/schemas/AgreementValue' }
        raters:
          type: array
          items:
            type: object
            properties:
              reviewerId: { type: string, format: uuid }
              reviews: { type: integer }
              bias: { type: number, description: mean(rater - leave-one-out consensus), ladder units }
              kappaVsConsensus: { $ref: '#/components/schemas/AgreementValue' }
              outlierRate: { type: number }
              flagged: { type: boolean }
        pairs:
          type: array
          items:
            type: object
            properties:
              a: { type: string, format: uuid }
              b: { type: string, format: uuid }
              cohenKappaQuadratic: { $ref: '#/components/schemas/AgreementValue' }

    # ---- tournaments ----
    TournamentInput:
      type: object
      required: [name, startsOn, entriesCloseAt]
      properties:
        name: { type: string }
        venue: { type: string }
        startsOn: { type: string, format: date }
        entriesCloseAt: { type: string, format: date-time }
    Tournament:
      allOf:
        - { $ref: '#/components/schemas/TournamentInput' }
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [draft, open, closed, running, finished] }
    TournamentDetail:
      allOf:
        - { $ref: '#/components/schemas/Tournament' }
        - type: object
          properties:
            events: { type: array, items: { $ref: '#/components/schemas/Event' } }
    EventDetail:
      allOf:
        - { $ref: '#/components/schemas/Event' }
        - type: object
          properties:
            tournamentName: { type: string }
            tournamentStatus: { type: string, enum: [draft, open, closed, running, finished] }
            entryCount: { type: integer }
    TournamentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tournament' } }
        nextCursor: { type: [string, 'null'] }
    EventInput:
      type: object
      required: [discipline, gradeMin, gradeMax]
      properties:
        discipline: { type: string, enum: [MS, WS, MD, WD, XD] }
        gradeMin: { $ref: '#/components/schemas/GradeKey' }
        gradeMax: { $ref: '#/components/schemas/GradeKey' }
        maxEntries: { type: integer, maximum: 256 }
        requiresFreshAssessment: { type: boolean, default: false, description: 'A13: entry needs an approved assessment bound to this event' }
        minReviewers: { type: integer, minimum: 1, maximum: 5, default: 2, description: 'G3prime: valid reviews needed before computing; >= 3 uses the full v1 pipeline' }
    Event:
      allOf:
        - { $ref: '#/components/schemas/EventInput' }
        - type: object
          required: [id, tournamentId]
          properties:
            id: { type: string, format: uuid }
            tournamentId: { type: string, format: uuid }
            gradesDisclosedAt: { type: [string, 'null'], format: date-time, description: 'A14 transparency disclosure' }
            gradesDisclosedReason: { type: [string, 'null'] }
    EntryStatus:
      type: string
      enum: [draft, pending_committee, approved, rejected, withdrawn]
      description: 'architecture §6.10; draw/group draws use approved entries only'
    EntryInput:
      type: object
      required: [players]
      properties:
        name: { type: string, maxLength: 80, description: optional pair/team display name }
        players:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: object
            required: [userId]
            properties:
              userId: { type: string, format: uuid }
              teamId: { type: string, format: uuid, description: 'club picked via GET /teams/suggest (A8); added as a dated membership if new for the player (MULTI_TEAM warning applies)' }
    Entry:
      type: object
      required: [id, eventId, players, status]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EntryStatus' }
        name: { type: [string, 'null'], description: optional pair/team display name }
        createdBy: { type: string, format: uuid }
        forwardedAt: { type: [string, 'null'], format: date-time }
        decidedBy: { type: [string, 'null'], format: uuid }
        decidedAt: { type: [string, 'null'], format: date-time }
        decisionReason: { type: [string, 'null'] }
        players:
          type: array
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              displayName: { type: string }
              teamIds: { type: array, items: { type: string, format: uuid } }
              teamId: { type: [string, 'null'], format: uuid, description: 'club picked for THIS entry (EntryInput.players[].teamId)' }
              teamCount: { type: integer, description: 'teams the player currently belongs to (A11 warning when > 1)' }
              gradeConsent: { type: boolean, description: 'A14 consent of this player' }
              grade: { oneOf: [{ $ref: '#/components/schemas/GradeView' }, { type: 'null' }], description: 'null when hidden to the caller' }
        seedScore: { type: [number, 'null'], description: 'singles = player score; doubles = mean of both (draw.md §3); null when hidden to the caller' }
        gradeVisibility: { type: string, enum: [hidden, public, disclosed], description: 'A14: public = all players consented; disclosed = event transparency disclosure' }
        warnings: { type: array, items: { type: string, enum: [MULTI_TEAM, NO_APPROVED_GRADE, GRADE_OUT_OF_BAND, FRESH_ASSESSMENT_REQUIRED] }, description: 'computed live; shown to Admin/Committee' }
        warningDetails:
          type: array
          description: 'one row per (warning, player); Admin/Committee only'
          items:
            type: object
            required: [code]
            properties:
              code: { type: string, enum: [MULTI_TEAM, NO_APPROVED_GRADE, GRADE_OUT_OF_BAND, FRESH_ASSESSMENT_REQUIRED] }
              userId: { type: [string, 'null'], format: uuid }
              displayName: { type: [string, 'null'] }
              teamNames: { type: array, items: { type: string }, description: 'MULTI_TEAM: all current clubs of the player' }
              gradeLabel: { type: [string, 'null'], description: 'GRADE_OUT_OF_BAND: the player label, e.g. N-' }

    # ---- draws ----
    DrawSummary:
      type: object
      required: [id, eventId, version, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string, enum: [preview, published, discarded, superseded, locked], description: 'discarded = preview not chosen once another version was published (draw.md §6)' }
        sameTeamR1Count: { type: integer }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string, format: uuid }
    Draw:
      allOf:
        - { $ref: '#/components/schemas/DrawSummary' }
        - type: object
          properties:
            seed: { type: string }
            inputHash: { type: string }
            kind: { type: string, enum: [knockout, group], default: knockout, description: 'group = bl-17 group draw' }
            rulesetVersion: { type: string, example: draw-v1 }
            size: { type: integer, description: bracket size (power of two) }
            slots:
              type: array
              items:
                type: object
                properties:
                  position: { type: integer, description: 1..size }
                  entryId: { type: [string, 'null'], format: uuid, description: null = bye }
                  seedNo: { type: [integer, 'null'] }
            conflicts:
              type: array
              description: unavoidable same-team round-1 matches (empty in the normal case)
              items:
                type: object
                properties:
                  matchNo: { type: integer }
                  teamId: { type: string, format: uuid }
            minimumPossibleConflicts: { type: integer }
    Bracket:
      type: object
      properties:
        eventId: { type: string, format: uuid }
        drawVersion: { type: integer }
        rounds:
          type: array
          items:
            type: object
            properties:
              round: { type: integer }
              matches:
                type: array
                items:
                  type: object
                  properties:
                    matchNo: { type: integer }
                    top: { type: [string, 'null'], format: uuid, description: entryId }
                    topEntry: { oneOf: [{ $ref: '#/components/schemas/EntryRef' }, { type: 'null' }] }
                    bottomEntry: { oneOf: [{ $ref: '#/components/schemas/EntryRef' }, { type: 'null' }] }
                    bottom: { type: [string, 'null'], format: uuid }
                    winner: { type: [string, 'null'], format: uuid }
                    status: { type: string, enum: [scheduled, bye, reported, confirmed, walkover] }

    # ---- format (bl-17 DRAFT) ----
    MatchFormat:
      type: object
      required: [mode, games, pointsPerGame, deuce]
      properties:
        preset: { type: string, enum: [group_2x15, single_30, bo3_21, single_21, custom] }
        mode: { type: string, enum: [fixed_games, best_of] }
        games: { type: integer, minimum: 1, maximum: 5 }
        pointsPerGame: { type: integer, minimum: 5, maximum: 31 }
        deuce: { type: boolean }
        cap: { type: [integer, 'null'] }
        drawAllowed: { type: boolean, default: false }
    EventFormat:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [knockout, groups_knockout] }
        groupSize: { type: integer, minimum: 3, maximum: 5, default: 4 }
        advancePerGroup: { type: integer, minimum: 1, maximum: 2, default: 2 }
        bestThirds: { type: integer, minimum: 0, default: 0 }
        groupMatchFormat: { $ref: '#/components/schemas/MatchFormat' }
        knockoutMatchFormat: { $ref: '#/components/schemas/MatchFormat' }
        points:
          type: object
          properties:
            win: { type: integer, default: 3 }
            draw: { type: integer, default: 1 }
            loss: { type: integer, default: 0 }
        tiebreakers: { type: array, items: { type: string, enum: [points, point_diff, head_to_head, points_for, game_diff, lot] } }
        thirdPlacePlayoff: { type: boolean, default: true }
        lockedAt: { type: [string, 'null'], format: date-time, readOnly: true }
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        stage: { type: string, enum: [group, knockout, third_place] }
        groupId: { type: [string, 'null'], format: uuid }
        round: { type: integer }
        a: { type: [string, 'null'], format: uuid, description: entryId }
        b: { type: [string, 'null'], format: uuid }
        aEntry: { oneOf: [{ $ref: '#/components/schemas/EntryRef' }, { type: 'null' }] }
        bEntry: { oneOf: [{ $ref: '#/components/schemas/EntryRef' }, { type: 'null' }] }
        games: { type: array, items: { type: object, properties: { a: { type: integer }, b: { type: integer } } } }
        result: { type: [string, 'null'], enum: [a_win, b_win, draw, walkover_a, walkover_b, void, null] }
        status: { type: string, enum: [scheduled, bye, reported, confirmed, walkover, void], description: 'standings and knockout progression count confirmed only' }
        court: { type: [string, 'null'] }
        umpireId: { type: [string, 'null'], format: uuid }
        reportedBy: { type: [string, 'null'], format: uuid }
        reportedAt: { type: [string, 'null'], format: date-time }
        confirmedBy: { type: [string, 'null'], format: uuid }
        confirmedAt: { type: [string, 'null'], format: date-time }
        flags: { type: array, items: { type: string, enum: [UMPIRE_TEAM_CONFLICT, COMMITTEE_DIRECT_ENTRY, CORRECTED] } }
        format:
          allOf: [{ $ref: '#/components/schemas/MatchFormat' }]
          readOnly: true
          description: 'the scoring rules of this match, resolved server-side from the event format: stage group -> groupMatchFormat, knockout | third_place -> knockoutMatchFormat (missing -> preset group_2x15 / bo3_21). Always present in every Match response, so the umpire form and score validation never guess (Andy 2026-10-08).'
    EventUmpire:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        displayName: { type: string, readOnly: true }
        courts: { type: array, items: { type: string }, description: 'empty = all courts of the event' }
    EntryRef:
      type: object
      description: 'compact entry label for brackets/standings/matches; public-safe (no grade unless visible per A14)'
      properties:
        entryId: { type: string, format: uuid }
        displayName: { type: string, description: 'pair name, or the player names joined with " / "' }
        players: { type: array, items: { type: object, properties: { userId: { type: string, format: uuid }, displayName: { type: string } } } }
        teamNames: { type: array, items: { type: string }, description: clubs picked for this entry }
        gradeLabel: { type: [string, 'null'], description: 'GradeView.label only when the entry grade is public/disclosed (A14), else null' }
    Group:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, example: A }
        members:
          type: array
          items:
            type: object
            properties:
              entryId: { type: string, format: uuid }
              seedInGroup: { type: integer }
              pot: { type: integer }
        matches: { type: array, items: { $ref: '#/components/schemas/Match' } }
    GroupStanding:
      type: object
      properties:
        groupId: { type: string, format: uuid }
        entryId: { type: string, format: uuid }
        entry: { $ref: '#/components/schemas/EntryRef' }
        rank: { type: integer }
        played: { type: integer }
        won: { type: integer }
        drawn: { type: integer }
        lost: { type: integer }
        points: { type: integer }
        pointsFor: { type: integer }
        pointsAgainst: { type: integer }
        diff: { type: integer }
        tiebreakNote: { type: [string, 'null'] }
        qualification: { type: string, enum: [qualified, best_third, best_third_contender, out] }
        confirmed: { type: boolean, description: true when served from the confirmed snapshot }

    # ---- audit ----
    AuditPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              actorId: { type: [string, 'null'], format: uuid }
              action: { type: string, example: assessment.override }
              entityType: { type: string }
              entityId: { type: string }
              before: { type: object }
              after: { type: object }
              reason: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
        nextCursor: { type: [string, 'null'] }
    OverrideInput:
      type: object
      description: 'grading §8: the override sets only the center grade; score = idx + 0.5, margin = 0, lower = upper = center, kind exact (no margin input)'
      required: [centerKey, reason]
      properties:
        centerKey: { $ref: '#/components/schemas/GradeKey' }
        resultVersion: { type: integer, description: optimistic check, must equal the latest version }
        reason: { type: string, minLength: 20, maxLength: 2000 }
    EntryRejectInput:
      type: object
      description: 'entry reject reason, min 10 chars (decision 2026-10-07, matches the design; other ReasonInput uses stay at 5)'
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 2000 }
