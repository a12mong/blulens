<!DOCTYPE html>

<html lang="th"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>เข้าสู่ระบบ - blulens</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;family=Prompt:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {},
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Prompt", "Public Sans", "sans-serif"],
            display: ["Prompt", "Public Sans", "sans-serif"],
            body: ["Prompt", "Public Sans", "sans-serif"],
            label: ["Prompt", "Public Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Prompt', 'Public Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#f6f1ea] text-[#2b2238] min-h-screen flex flex-col justify-between antialiased selection:bg-[#4b4fd6]/10 selection:text-[#4b4fd6]">
<!-- TopAppBar Component (from Shared Components JSON) -->
<header class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between px-4 h-14 w-full bg-[#fffdf9] border-b border-[#8f7f6d]/20">
<button aria-label="ย้อนกลับ" class="active:scale-95 transition-transform duration-150 min-h-[44px] min-w-[44px] flex items-center justify-center text-[#6b6075] hover:bg-[#f1e9de] rounded-lg" type="button">
<span class="material-symbols-outlined text-xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-base font-semibold text-[#2b2238]" id="appBarTitle">เข้าสู่ระบบ</h1>
<button aria-label="ศูนย์ช่วยเหลือ" class="active:scale-95 transition-transform duration-150 min-h-[44px] min-w-[44px] flex items-center justify-center text-[#6b6075] hover:bg-[#f1e9de] rounded-lg" type="button">
<span class="material-symbols-outlined text-xl" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Mobile Container (Targeting 360px viewport experience) -->
<main class="w-full max-w-[360px] mx-auto pt-20 pb-8 px-4 flex-1 flex flex-col justify-start">
<!-- Brand Visual & Identity -->
<div class="mb-5 text-center">
<div class="inline-flex items-center justify-center w-11 h-11 rounded-xl bg-[#4b4fd6] text-white shadow-sm mb-2.5">
<span class="material-symbols-outlined text-2xl" data-icon="insights" style="font-variation-settings: 'FILL' 1;">insights</span>
</div>
<div class="tracking-tight font-bold text-xl text-[#2b2238]">blulens</div>
<p class="text-xs text-[#6b6075] mt-0.5">ระบบประเมินสมรรถภาพและการวิเคราะห์ข้อมูลกีฬา</p>
</div>
<!-- Segmented Control / Tab Switcher -->
<div aria-label="โหมดการยืนยันตัวตน" class="bg-[#f1e9de] p-1 rounded-xl flex items-center mb-5" role="tablist">
<button aria-selected="true" class="flex-1 py-2 text-sm font-semibold rounded-[10px] transition-all duration-200 bg-[#fffdf9] text-[#4b4fd6] shadow-sm min-h-[40px] flex items-center justify-center" id="tabLogin" role="tab" type="button">
        เข้าสู่ระบบ
      </button>
<button aria-selected="false" class="flex-1 py-2 text-sm font-normal rounded-[10px] transition-all duration-200 text-[#6b6075] hover:text-[#2b2238] min-h-[40px] flex items-center justify-center" id="tabRegister" role="tab" type="button">
        สมัครสมาชิก
      </button>
</div>
<!-- Primary Authentication Card -->
<div class="bg-[#fffdf9] border border-[#e6ddce] rounded-xl p-5 shadow-sm">
<!-- Section Header -->
<div class="mb-5">
<h2 class="text-lg font-bold text-[#2b2238]" id="formTitle">เข้าสู่ระบบ</h2>
<p class="text-xs text-[#6b6075] mt-0.5" id="formSubtitle">กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
</div>
<!-- Authentication Form -->
<form class="space-y-4" id="authForm" onsubmit="event.preventDefault();">
<!-- Field: Full Name (Visible only in register mode) -->
<div class="hidden flex-col space-y-1.5 transition-all duration-200" id="fieldFullName">
<label class="text-xs font-semibold text-[#2b2238] flex items-center gap-1" for="fullNameInput">
<span>ชื่อ-นามสกุล</span>
<span class="text-[#b03b3a] text-xs">*</span>
</label>
<div class="relative">
<input autocomplete="name" class="w-full bg-[#fffdf9] text-[#2b2238] placeholder-[#8f7f6d]/70 text-sm border border-[#8f7f6d]/40 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-[#4b4fd6] focus:ring-2 focus:ring-[#4b4fd6] transition-colors" id="fullNameInput" name="fullname" placeholder="สมชาย ใจดี" type="text"/>
</div>
</div>
<!-- Field: Email -->
<div class="flex flex-col space-y-1.5">
<label class="text-xs font-semibold text-[#2b2238] flex items-center gap-1" for="emailInput">
<span>อีเมล</span>
<span class="text-[#b03b3a] text-xs">*</span>
</label>
<div class="relative">
<input autocomplete="email" class="w-full bg-[#fffdf9] text-[#2b2238] placeholder-[#8f7f6d]/70 text-sm border border-[#8f7f6d]/40 rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-[#4b4fd6] focus:ring-2 focus:ring-[#4b4fd6] transition-colors" id="emailInput" name="email" placeholder="name@example.com" required="" type="email" value="athlete.pro@example.com"/>
</div>
</div>
<!-- Field: Password -->
<div class="flex flex-col space-y-1.5">
<label class="text-xs font-semibold text-[#2b2238] flex items-center gap-1" for="passwordInput">
<span>รหัสผ่าน</span>
<span class="text-[#b03b3a] text-xs">*</span>
</label>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-[#fffdf9] text-[#2b2238] placeholder-[#8f7f6d]/70 text-sm border border-[#8f7f6d]/40 rounded-xl pl-3.5 pr-11 py-2.5 focus:outline-none focus:border-[#4b4fd6] focus:ring-2 focus:ring-[#4b4fd6] transition-colors" id="passwordInput" name="password" placeholder="กรอกรหัสผ่านของคุณ" required="" type="password" value="secretPass123"/>
<button aria-label="แสดงหรือซ่อนรหัสผ่าน" class="absolute right-0 top-0 bottom-0 px-3 text-[#6b6075] hover:text-[#2b2238] flex items-center justify-center min-h-[44px] min-w-[44px] active:scale-95 transition-transform" id="togglePasswordBtn" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Auxiliary Action: Forgot Password -->
<div class="flex justify-end pt-0.5" id="forgotPasswordContainer">
<a class="text-xs font-medium text-[#4b4fd6] hover:underline focus:outline-none py-1 min-h-[32px] inline-flex items-center" href="#forgot">
            ลืมรหัสผ่าน?
          </a>
</div>
<!-- Prominent Error Message Alert -->
<div class="flex items-center gap-2 p-2.5 rounded-lg bg-[#fbeeed] border border-[#b03b3a]/30 text-[#b03b3a] text-xs transition-opacity duration-200" id="alertMessage">
<span class="material-symbols-outlined text-base flex-shrink-0" data-icon="error_outline">error_outline</span>
<span class="font-medium tracking-normal leading-tight" id="alertMessageText">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-[#4b4fd6] hover:bg-[#3f43b8] active:scale-[0.99] text-white font-medium text-sm rounded-xl transition-all flex items-center justify-center shadow-sm min-h-[48px]" id="submitButton" type="submit">
<span id="submitButtonText">เข้าสู่ระบบ</span>
</button>
</form>
</div>
<!-- Tier Badges Hint Section (Consistent with Design System Grade Tiers) -->
<div class="mt-4 p-3 bg-[#f1e9de]/70 rounded-xl border border-[#e6ddce]">
<div class="text-[11px] font-semibold text-[#6b6075] uppercase tracking-wider mb-1.5 flex items-center gap-1">
<span class="material-symbols-outlined text-xs" data-icon="verified">verified</span>
        ระดับการใช้งานที่รองรับ
      </div>
<div class="flex flex-wrap gap-1.5 text-[11px]">
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#2a7034]/10 text-[#2a7034] font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-[#2a7034]"></span>Rookie
        </span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#2a64a0]/10 text-[#2a64a0] font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-[#2a64a0]"></span>Beginner
        </span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#7b47b8]/10 text-[#7b47b8] font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-[#7b47b8]"></span>Standard
        </span>
<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-[#a14e1b]/10 text-[#a14e1b] font-medium">
<span class="w-1.5 h-1.5 rounded-full bg-[#a14e1b]"></span>Neutral
        </span>
</div>
</div>
<!-- Bottom Switcher Prompt -->
<div class="mt-5 text-center">
<div class="text-xs text-[#6b6075] flex items-center justify-center gap-1.5">
<span id="footerPromptText">ยังไม่มีบัญชี?</span>
<button class="font-semibold text-[#4b4fd6] hover:underline p-1 min-h-[44px] inline-flex items-center" id="footerSwitchAction" type="button">
          สมัครสมาชิก
        </button>
</div>
</div>
</main>
<!-- Interactive Logic -->
<script>
    (function () {
      let isRegisterMode = false;

      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const appBarTitle = document.getElementById('appBarTitle');
      const formTitle = document.getElementById('formTitle');
      const formSubtitle = document.getElementById('formSubtitle');
      const fieldFullName = document.getElementById('fieldFullName');
      const forgotPasswordContainer = document.getElementById('forgotPasswordContainer');
      const alertMessage = document.getElementById('alertMessage');
      const alertMessageText = document.getElementById('alertMessageText');
      const submitButtonText = document.getElementById('submitButtonText');
      const footerPromptText = document.getElementById('footerPromptText');
      const footerSwitchAction = document.getElementById('footerSwitchAction');
      const togglePasswordBtn = document.getElementById('togglePasswordBtn');
      const passwordInput = document.getElementById('passwordInput');
      const passwordIcon = document.getElementById('passwordIcon');

      function updateViewState(register) {
        isRegisterMode = register;

        if (isRegisterMode) {
          // Switch to Register State
          tabLogin.className = "flex-1 py-2 text-sm font-normal rounded-[10px] transition-all duration-200 text-[#6b6075] hover:text-[#2b2238] min-h-[40px] flex items-center justify-center";
          tabLogin.setAttribute('aria-selected', 'false');

          tabRegister.className = "flex-1 py-2 text-sm font-semibold rounded-[10px] transition-all duration-200 bg-[#fffdf9] text-[#4b4fd6] shadow-sm min-h-[40px] flex items-center justify-center";
          tabRegister.setAttribute('aria-selected', 'true');

          appBarTitle.textContent = 'สมัครสมาชิก';
          formTitle.textContent = 'สมัครสมาชิก';
          formSubtitle.textContent = 'สร้างบัญชีเพื่อเริ่มต้นบันทึกและประเมินผล';

          fieldFullName.classList.remove('hidden');
          fieldFullName.classList.add('flex');

          forgotPasswordContainer.classList.add('hidden');
          alertMessage.classList.add('hidden');

          submitButtonText.textContent = 'สมัครสมาชิก';
          footerPromptText.textContent = 'มีบัญชีอยู่แล้ว?';
          footerSwitchAction.textContent = 'เข้าสู่ระบบ';
        } else {
          // Switch to Login State
          tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-[10px] transition-all duration-200 bg-[#fffdf9] text-[#4b4fd6] shadow-sm min-h-[40px] flex items-center justify-center";
          tabLogin.setAttribute('aria-selected', 'true');

          tabRegister.className = "flex-1 py-2 text-sm font-normal rounded-[10px] transition-all duration-200 text-[#6b6075] hover:text-[#2b2238] min-h-[40px] flex items-center justify-center";
          tabRegister.setAttribute('aria-selected', 'false');

          appBarTitle.textContent = 'เข้าสู่ระบบ';
          formTitle.textContent = 'เข้าสู่ระบบ';
          formSubtitle.textContent = 'กรุณากรอกข้อมูลเพื่อเข้าสู่ระบบ';

          fieldFullName.classList.add('hidden');
          fieldFullName.classList.remove('flex');

          forgotPasswordContainer.classList.remove('hidden');
          alertMessage.classList.remove('hidden');
          alertMessageText.textContent = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';

          submitButtonText.textContent = 'เข้าสู่ระบบ';
          footerPromptText.textContent = 'ยังไม่มีบัญชี?';
          footerSwitchAction.textContent = 'สมัครสมาชิก';
        }
      }

      tabLogin.addEventListener('click', function () {
        updateViewState(false);
      });

      tabRegister.addEventListener('click', function () {
        updateViewState(true);
      });

      footerSwitchAction.addEventListener('click', function () {
        updateViewState(!isRegisterMode);
      });

      // Toggle password visibility
      togglePasswordBtn.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          passwordIcon.textContent = 'visibility_off';
          passwordIcon.setAttribute('data-icon', 'visibility_off');
        } else {
          passwordInput.type = 'password';
          passwordIcon.textContent = 'visibility';
          passwordIcon.setAttribute('data-icon', 'visibility');
        }
      });
    })();
  </script>
</body></html>
